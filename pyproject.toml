[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyflock"
version = "0.1.0"
description = "One-dimensional flocks of coupled linear oscillators: symbols, signal velocities, transients"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["pyflock*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
