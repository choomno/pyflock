[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyflock"
version = "0.2.0"
description = "Reproducible experiments on propagation and transients in oscillator arrays"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "mpmath>=1.3"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["pyflock*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
