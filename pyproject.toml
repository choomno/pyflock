[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyflock"
version = "0.2.0"
description = "Reproducible experiments on propagation and transients in oscillator arrays"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "mpmath>=1.3"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Repository = "https://github.com/choomno/pyflock"

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["pyflock*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
include = ["pyflock/**/*.py", "examples/**/*.py", "tests/**/*.py", "ci/**/*.py"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "C4", "RUF"]
# Bibliographic page ranges and displayed intervals use en dashes.
allowed-confusables = ["–"]

[tool.coverage.run]
branch = true
parallel = true
patch = ["subprocess"]
concurrency = ["multiprocessing"]
source = ["pyflock"]
relative_files = true

[tool.coverage.paths]
source = ["pyflock", "*/site-packages/pyflock"]

[tool.coverage.report]
precision = 2
exclude_lines = []
partial_branches = []
