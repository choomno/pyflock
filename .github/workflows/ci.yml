name: Tests, coverage and documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.12'
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel and source distribution
        run: |
          python -m pip install build==1.6.1
          python -m build
          python ci/check_distribution.py dist
      - name: Install the wheel and test dependencies
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'pytest>=7', glob.glob('dist/*.whl')[0]])"
      - name: Run maintained tests
        run: python -m pytest -q
      - name: Check the installed wheel outside the checkout
        run: python ci/check_installed.py
      - name: Rebuild and test the source distribution
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python ci/check_sdist.py dist

  coverage:
    name: Line and branch coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt -e .
      - name: Measure the complete maintained package
        run: |
          python -m coverage erase
          python -m coverage run -m pytest -q
          python -m coverage combine
          python -m coverage json -o coverage.json
          python ci/check_coverage.py coverage.json
      - name: Retain coverage results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.json
          if-no-files-found: error
          retention-days: 14

  documentation:
    name: Lint and mathematical documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.17.1
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python ci/check_docs.py
      - name: Install TeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y texlive-latex-base texlive-latex-recommended lmodern
      - name: Compile the mathematical reference
        run: python ci/build_docs.py --output "${{ runner.temp }}/mathematical-reference.pdf"
      - name: Retain the compiled reference
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mathematical-reference
          path: ${{ runner.temp }}/mathematical-reference.pdf
          if-no-files-found: error
          retention-days: 14
